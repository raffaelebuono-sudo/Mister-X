<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>JARVIS Orb</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: transparent;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      cursor: grab;
      user-select: none;
      -webkit-user-select: none;
    }
    body:active { cursor: grabbing; }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <canvas id="orb"></canvas>
  <script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
  </script>
  <script type="module" src="./orb.js"></script>
</body>
</html>
