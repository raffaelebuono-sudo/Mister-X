<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>JARVIS Dashboard</title>
  <link rel="stylesheet" href="./dashboard.css">
</head>
<body>
  <div class="app">

    <!-- Sidebar mit Schnellaktionen -->
    <aside class="sidebar" aria-label="Schnellaktionen">
      <div class="brand">JARVIS</div>
      <button class="quick" data-action="news">News abrufen</button>
      <button class="quick" data-action="weather">Wetter</button>
      <button class="quick" data-action="calendar">Kalender</button>
      <button class="quick" data-action="reminder">Neue Erinnerung</button>
      <button class="quick" data-action="settings">Einstellungen</button>
    </aside>

    <!-- Header mit Status und Mikro -->
    <header class="status-bar" aria-label="Status">
      <span class="state-dot" id="state-dot"></span>
      <span class="state-label" id="state-label">verbinde…</span>
      <span class="state-message" id="state-message"></span>
      <button class="mic" id="mic-btn" title="Manuell aufnehmen (folgt)">🎙</button>
    </header>

    <!-- Chat -->
    <section class="chat" aria-label="Gespräch">
      <div class="messages" id="messages"></div>
      <form class="composer" id="composer" autocomplete="off">
        <input type="text" id="chat-input" placeholder="Frage tippen…" />
        <label class="speak-toggle">
          <input type="checkbox" id="speak-checkbox"> vorlesen
        </label>
        <button type="submit">Senden</button>
      </form>
    </section>

    <!-- System-Monitor -->
    <aside class="monitor" aria-label="System">
      <h3>Mac</h3>
      <div class="metric"><span>CPU</span><b id="cpu">–</b></div>
      <div class="bar"><i id="cpu-bar"></i></div>
      <div class="metric"><span>RAM</span><b id="ram">–</b></div>
      <div class="metric"><span>Festplatte</span><b id="disk">–</b></div>
      <div class="metric"><span>Akku</span><b id="battery">–</b></div>

      <h3>JARVIS</h3>
      <div class="metric"><span>Uptime</span><b id="jarvis-uptime">–</b></div>
      <div class="metric"><span>System läuft</span><b id="system-uptime">–</b></div>
    </aside>

    <!-- Aufgaben -->
    <section class="tasks" aria-label="Aufgaben">
      <header>
        <h3>Aufgaben &amp; Erinnerungen</h3>
        <form id="add-task-form" autocomplete="off">
          <input type="text" id="new-task" placeholder="Neue Aufgabe…">
          <input type="datetime-local" id="new-task-due">
          <button type="submit">+</button>
        </form>
      </header>
      <ul id="task-list"></ul>
    </section>

  </div>
  <script src="./dashboard.js" type="module"></script>
</body>
</html>
