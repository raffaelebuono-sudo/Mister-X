<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>JARVIS Dashboard</title>
  <style>
    :root {
      --bg: #0a0e1a;
      --panel: #111733;
      --border: #243054;
      --text: #d6e4ff;
      --accent: #4ab8ff;
      --muted: #6b7ba0;
    }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      min-height: 100vh;
      display: grid;
      place-items: center;
    }
    .card {
      padding: 3rem 4rem;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--panel);
      text-align: center;
      max-width: 520px;
    }
    h1 { margin: 0 0 1rem; font-weight: 600; }
    .state {
      color: var(--accent);
      font-weight: 600;
      font-variant: small-caps;
      letter-spacing: .04em;
    }
    .hint { color: var(--muted); margin-top: 1.5rem; font-size: .9rem; }
    .dot {
      display: inline-block; width: .55rem; height: .55rem; border-radius: 50%;
      background: var(--accent); margin-right: .4rem; vertical-align: middle;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>JARVIS</h1>
    <p><span class="dot"></span>Aktueller Zustand: <span class="state" id="state">verbinde…</span></p>
    <p id="message" style="color: var(--muted); min-height: 1.4em;"></p>
    <p class="hint">Vollständiges Dashboard folgt in Phase 5.</p>
  </div>
  <script>
    const stateEl = document.getElementById('state');
    const msgEl = document.getElementById('message');
    function connect() {
      const ws = new WebSocket('ws://127.0.0.1:8765');
      ws.onmessage = (e) => {
        try {
          const data = JSON.parse(e.data);
          if (data.state) stateEl.textContent = data.state;
          msgEl.textContent = data.message || '';
        } catch { /* ignorieren */ }
      };
      ws.onclose = () => { stateEl.textContent = 'getrennt'; setTimeout(connect, 1500); };
      ws.onerror = () => ws.close();
    }
    connect();
  </script>
</body>
</html>
